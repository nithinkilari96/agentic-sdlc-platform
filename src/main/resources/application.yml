spring:
  application:
    name: agentic-sdlc-platform

  datasource:
    # File-backed H2 so workflow state survives a restart. The crash-recovery
    # behaviour is the point of this choice: an in-memory database would make
    # every restart look like a clean slate and hide the very failure mode the
    # recovery path exists to handle.
    url: jdbc:h2:file:./data/agentic;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        # Metrics are part of the deliverable, so the endpoints are exposed by
        # default here. A real deployment would put these behind an internal
        # listener rather than the public one.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

agentic:
  workspaces:
    root: workspaces
  model:
    # Falls back to the deterministic provider when unset, so the platform runs
    # with no credentials. Set ANTHROPIC_API_KEY to use the live model.
    id: claude-opus-5

logging:
  level:
    com.kilari.agentic: INFO
